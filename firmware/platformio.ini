; Ngen-ko 2.0 - Firmware ESP32
; Compilar:  pio run                   (protoboard con módulo de relés)
;            pio run -e pcb            (placa Ngen-ko 2.0, ver hardware/)
; Subir:     pio run -t upload         (agregar -e pcb para la placa)
; Monitor:   pio device monitor

[platformio]
default_envs = esp32dev

; Protoboard: DevKit + módulo de relés (se activa con LOW)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Más espacio para el programa, manteniendo dos particiones para OTA
board_build.partitions = min_spiffs.csv
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    -DCORE_DEBUG_LEVEL=0

; PCB Ngen-ko 2.0: relés con transistor (se activan con HIGH)
[env:pcb]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DRELAY_ACTIVE_LOW=false

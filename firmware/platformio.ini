; Ngen-ko 2.0 - Firmware ESP32
; Compilar:  pio run
; Subir:     pio run -t upload
; Monitor:   pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Más espacio para el programa, manteniendo dos particiones para OTA
board_build.partitions = min_spiffs.csv
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    -DCORE_DEBUG_LEVEL=0
